<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tongi College Chatrodol Help Centre</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f8fb;
      margin: 0;
      padding: 0;
    }
    header {
      background: #006400;
      color: white;
      text-align: center;
      padding: 20px;
    }
    header img {
      height: 80px;
    }
    h1 {
      margin: 10px 0 0 0;
    }
    .container {
      width: 80%;
      margin: auto;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    textarea {
      width: 100%;
      height: 120px;
      border-radius: 8px;
      border: 1px solid #ccc;
      padding: 10px;
      font-size: 16px;
    }
    .btn {
      display: inline-block;
      background: #006400;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 16px;
      margin-top: 10px;
    }
    footer {
      background: #006400;
      color: white;
      text-align: center;
      padding: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>
    <img src="https://upload.wikimedia.org/wikipedia/en/8/8c/Bangladesh_Chatra_Dal_logo.png" alt="Chatrodol Logo">
    <h1>Tongi College Chatrodol Help Centre</h1>
  </header>

  <div class="container">
    <div class="card">
      <h2>অভিযোগ জমা দিন</h2>

      <textarea placeholder="এখানে আপনার অভিযোগ লিখুন..."></textarea><br>
      <a class="btn" href="https://wa.me/8801327176252" target="_blank">WhatsApp এ অভিযোগ পাঠান</a>
    </div>
  </div>

  <footer>
    <p>© ২০২৫ Tongi College Chatrodol Help Centre | যোগাযোগ: 01327176252</p>
  </footer>
